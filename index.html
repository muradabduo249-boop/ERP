    <script>
      // Gracefully handle Vite HMR WebSockets in sandbox environments where HMR is disabled
      if (typeof window !== 'undefined') {
        const OriginalWebSocket = window.WebSocket;
        window.WebSocket = function (url, protocols) {
          if (typeof url === 'string' && (url.includes('vite-hmr') || protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr')))) {
            const fakeWs = {
              readyState: 3, // CLOSED
              addEventListener: function () {},
              removeEventListener: function () {},
              send: function () {},
              close: function () {},
            };
            return fakeWs;
          }
          return new OriginalWebSocket(url, protocols);
        };
        Object.assign(window.WebSocket, OriginalWebSocket);
      }
    </script>
